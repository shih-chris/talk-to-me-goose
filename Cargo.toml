[package]
name = "talk-to-me-goose"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6"
async-trait = "0.1"
base64 = "0.22"
cpal = "0.18"
dirs = "6"
global-hotkey = "0.8"
keyring = { version = "4.1", default-features = false, features = ["v1"] }
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.36"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
macos-accessibility-client = "0.0.2"
